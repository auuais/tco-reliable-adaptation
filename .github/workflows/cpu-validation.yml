name: CPU evidence validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/checkout@v4
        with:
          repository: cvlab-stonybrook/TCO
          ref: 65387333877723cf99086f7f29089379dd50c59a
          path: third_party/TCO
      - name: Install CPU loss-test dependencies
        run: |
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.1.2 scipy==1.15.2 omegaconf==2.3.0 matplotlib==3.10.7
          python -m pip install --no-deps --only-binary=:all: poselib==2.0.5
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: python scripts/verify_public_development_tables.py
      - run: python scripts/verify_camera_studies.py
      - run: python scripts/summarize_sensor_windows.py
      - run: python scripts/summarize_sensor_extrinsic.py
      - run: python scripts/reference_repeat_sensitivity.py verify
      - run: python scripts/run_baseline_screen.py --dry-run
      - run: python scripts/run_prior_ablation_batch.py --dry-run
      - run: python scripts/evaluation_stability.py --dry-run
      - run: python scripts/run_repeat_calibration_batch.py --dry-run
      - run: python scripts/run_pose_precision_batch.py --dry-run
      - run: python scripts/run_pose_precision_fullcache_batch.py --dry-run
      - run: python scripts/cache_learned_support_v8.py --dry-run
      - name: Verify camera parameterization evidence
        run: |
          python scripts/audit_intrinsics_parameterization.py
          python scripts/verify_parameterization_evidence.py
      - name: Verify the published CPU controls and paired reconstruction scores
        run: python scripts/verify_local_execution_evidence.py
      - name: Verify all single-camera fault scoring conditions
        run: python scripts/localize_camera_prior_faults.py verify
      - name: Verify the selective camera repair decision
        run: python scripts/screen_single_camera_repair.py verify
      - name: Recompute camera omission errors from published gradients
        env:
          OPENBLAS_NUM_THREADS: "1"
        run: python scripts/verify_masked_camera_gradients.py
      - name: Verify cross-scene weights and optimal one-camera gradient bounds
        run: python scripts/soft_camera_gradient_bounds.py verify
      - name: Verify the full-model calibration comparison
        run: python scripts/evaluate_canonical_sensor_factorial.py verify
      - name: Verify matched focal-error and valid-zoom decisions
        run: python scripts/verify_focal_metadata_control.py
      - name: Replay focal ambiguity through measured optimizer updates
        run: python scripts/focal_gradient_deferral.py verify
      - name: Verify fresh-image calibration controls and analytical derivatives
        run: |
          python scripts/focal_zoom_gradient.py verify
          python scripts/verify_focal_zoom_derivatives.py
          python scripts/replay_focal_track_decisions.py
          python scripts/measure_focal_crop_response.py
      - name: Refit classical focal baseline from public matches
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: |
          python scripts/verify_visual_focal_baseline.py --rerun-solver
          python scripts/focal_prevalence_sensitivity.py
      - name: Replay the relative focal redesign
        run: python scripts/relative_focal_confirmation.py
      - name: Replay the offset-25 image windows and refit the visual solver
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: python scripts/verify_relative_focal_windows.py --refit-solver
      - name: Replay 72 dense focal trajectories and both depth-reference comparisons
        env:
          OPENBLAS_NUM_THREADS: "1"
        run: |
          python scripts/release_dense_focal_traces.py verify
          python scripts/dense_focal_headroom.py verify
          python scripts/diagnose_dense_focal_readout.py replay
      - name: Replay the local frozen-point precision comparison
        run: python scripts/score_matched_focal_heads.py verify
      - name: Refit depth scales and verify surface and pixel geometry results
        env:
          OPENBLAS_NUM_THREADS: "1"
        run: |
          python scripts/score_depth_scale_study.py verify
          python scripts/diagnose_depth_scale_pixels.py verify
          python scripts/depth_geometry_headroom.py verify
          python scripts/depth_spatial_support.py verify
      - name: Verify dense RGB depth decisions, reference scores and known-error controls
        env:
          OPENBLAS_NUM_THREADS: "1"
        run: |
          python scripts/score_dense_rgb_depth.py verify
          python scripts/dense_rgb_pixel_check.py verify
          python scripts/photometric_positive_control.py verify
      - name: Verify visibility, depth evidence, source-quality interventions and spatial transfer
        env:
          OPENBLAS_NUM_THREADS: "1"
        run: |
          python scripts/visibility_positive_control.py verify
          python scripts/run_visibility_model.py verify
          python scripts/score_visibility_model.py verify
          python scripts/depth_source_transplant.py verify
          python scripts/depth_grid_surface.py verify
          python scripts/spatial_depth_transfer.py verify
          python scripts/capture_visibility_support.py verify
          python scripts/observation_selection.py verify
      - name: Replay camera-spacing coverage and verify matched-input temporal comparisons
        env:
          OPENBLAS_NUM_THREADS: "1"
        run: |
          python scripts/prepare_source_spacing.py verify
          python scripts/source_spacing_control.py verify
          python scripts/collect_spacing_heads.py verify
          python scripts/predict_temporal_depth.py verify
          python scripts/score_temporal_depth.py verify
          python scripts/nearby_camera_depth_control.py verify
          python scripts/nearby_motion_depth.py verify
          python scripts/motion_depth_shrinkage.py verify
          python scripts/motion_source_substitution.py verify
          python scripts/nearby_rig_components.py verify
          python scripts/external_orientation_control.py verify
          python scripts/joint_camera_control.py verify
          python scripts/baseline_length_control.py verify
          python scripts/motion_reliability_weights.py verify
          python scripts/motion_reliability_surface.py verify
          python scripts/motion_spatial_placement.py verify
          python scripts/motion_placement_surface.py verify
          python scripts/motion_paired_geometry.py verify
          python scripts/motion_icp_effect.py verify
          python scripts/motion_shuffle_repeats.py verify
          python scripts/fit_rgb_surface_weights.py verify
          python scripts/score_surface_fitted_weights.py verify
          python scripts/depth_correction_diffusion.py verify
          python scripts/depth_diffusion_axial.py verify
          python scripts/per_view_alignment.py verify
          python scripts/rgb_rigid_view.py verify
          python scripts/rgb_rigid_paired.py verify
          python scripts/rigid_reference_surface.py verify
          python scripts/cross_view_surface.py verify
          python scripts/cross_view_axial.py verify
          python scripts/tco_cross_view_acceptance.py verify
          python scripts/anchor_ensemble_surface.py verify
          python scripts/anchor_ensemble_axial.py verify
          python scripts/anchor_pose_surface.py verify
          python scripts/anchor_disagreement_benefit.py verify
          python scripts/anchor_prior_fusion.py verify
          python scripts/anchor_prior_pose_errors.py verify
          python scripts/anchor_prior_gain_controls.py verify
          python scripts/camera_tangent_depth.py verify
          python scripts/camera_prior_selection_bound.py verify
          python scripts/tangent_paired_geometry.py verify
          python scripts/camera_mesh_render.py verify
          python scripts/camera_mesh_paired.py verify
          python scripts/camera_mesh_depth_bands.py verify
          python scripts/camera_mesh_range_limit.py verify
          python scripts/prior_noise_paired.py verify
          python scripts/prior_direction_paired.py verify
          python scripts/camera_prior_noise_repeats.py verify
          python scripts/prior_direction_control.py verify
          python scripts/prior_noise_normal_regions.py verify
          python scripts/neighborhood_tangent.py verify
          python scripts/joint_reprojection_paired.py verify
          python scripts/joint_rgb_reprojection.py verify
          python scripts/profile_camera_depth.py verify
      - run: python scripts/replay_neighbor_sparse_depth.py verify
      - name: Refit all 12 joint RGB reprojection models from public inputs
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: python scripts/replay_joint_reprojection_fit.py
