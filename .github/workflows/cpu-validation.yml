name: CPU evidence validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/checkout@v4
        with:
          repository: cvlab-stonybrook/TCO
          ref: 65387333877723cf99086f7f29089379dd50c59a
          path: third_party/TCO
      - uses: actions/checkout@v4
        with:
          repository: naver/mast3r
          ref: f5209afc300cec36239a7ac992263f36847bbba0
          path: third_party/mast3r
      - name: Install CPU loss-test dependencies
        run: |
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install safetensors==0.7.0 h5py==3.11.0
          python -m pip install numpy==2.1.2 scipy==1.15.2 omegaconf==2.3.0 matplotlib==3.10.7 opencv-python-headless==4.11.0.86
          python -m pip install --no-deps --only-binary=:all: poselib==2.0.5
      - name: Run CPU evidence unit tests
        run: |
          python - <<'PY'
          import unittest

          class EvidenceLoader(unittest.TestLoader):
              def getTestCaseNames(self, test_case):
                  names = super().getTestCaseNames(test_case)
                  if test_case.__module__ == "test_native_lora_decoder_groups":
                      # Real factor assignment runs inside the pinned experiment image.
                      names.remove("test_real_factor_assignment_on_cpu")
                  return names

          suite = EvidenceLoader().discover("scripts")
          result = unittest.TextTestRunner(verbosity=1).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY
      - run: python scripts/verify_public_development_tables.py
      - run: python -B -S scripts/tco_two_track_protocol.py verify
      - run: python -B -S scripts/replay_tco_two_track.py b-development
      - run: python -B -S scripts/replay_tco_two_track.py a-development
      - run: python -B -S scripts/report_tco_two_track_development.py
      - name: Independently replay the narrow hybrid selection from matched surface measurements
        run: |
          python -B -S scripts/report_tco_two_track_hybrid_selection.py alternative --out results/tco_two_track_v1/a_hybrid_selection_development.md
          if [ -f results/tco_two_track_v1/a_hybrid_selection_stress.md ]; then
            python -B -S scripts/report_tco_two_track_hybrid_selection.py stress --out results/tco_two_track_v1/a_hybrid_selection_stress.md
          fi
      - run: python scripts/verify_camera_studies.py
      - run: python scripts/summarize_sensor_windows.py
      - run: python scripts/summarize_sensor_extrinsic.py
      - run: python scripts/reference_repeat_sensitivity.py verify
      - run: python scripts/run_baseline_screen.py --dry-run
      - run: python scripts/run_prior_ablation_batch.py --dry-run
      - run: python scripts/evaluation_stability.py --dry-run
      - run: python scripts/run_repeat_calibration_batch.py --dry-run
      - run: python scripts/run_pose_precision_batch.py --dry-run
      - run: python scripts/run_pose_precision_fullcache_batch.py --dry-run
      - run: python scripts/cache_learned_support_v8.py --dry-run
      - name: Verify camera parameterization evidence
        run: |
          python scripts/audit_intrinsics_parameterization.py
          python scripts/verify_parameterization_evidence.py
      - name: Verify the published CPU controls and paired reconstruction scores
        run: python scripts/verify_local_execution_evidence.py
      - name: Verify all single-camera fault scoring conditions
        run: python scripts/localize_camera_prior_faults.py verify
      - name: Verify the selective camera repair decision
        run: python scripts/screen_single_camera_repair.py verify
      - name: Recompute camera omission errors from published gradients
        env:
          OPENBLAS_NUM_THREADS: "1"
        run: python scripts/verify_masked_camera_gradients.py
      - name: Verify cross-scene weights and optimal one-camera gradient bounds
        run: python scripts/soft_camera_gradient_bounds.py verify
      - name: Verify the full-model calibration comparison
        run: python scripts/evaluate_canonical_sensor_factorial.py verify
      - name: Verify matched focal-error and valid-zoom decisions
        run: python scripts/verify_focal_metadata_control.py
      - name: Replay focal ambiguity through measured optimizer updates
        run: python scripts/focal_gradient_deferral.py verify
      - name: Verify fresh-image calibration controls and analytical derivatives
        run: |
          python scripts/focal_zoom_gradient.py verify
          python scripts/verify_focal_zoom_derivatives.py
          python scripts/replay_focal_track_decisions.py
          python scripts/measure_focal_crop_response.py
      - name: Refit classical focal baseline from public matches
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: |
          python scripts/verify_visual_focal_baseline.py --rerun-solver
          python scripts/focal_prevalence_sensitivity.py
      - name: Replay the relative focal redesign
        run: python scripts/relative_focal_confirmation.py
      - name: Replay the offset-25 image windows and refit the visual solver
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: python scripts/verify_relative_focal_windows.py --refit-solver
      - name: Replay 72 dense focal trajectories and both depth-reference comparisons
        env:
          OPENBLAS_NUM_THREADS: "1"
        run: |
          python scripts/release_dense_focal_traces.py verify
          python scripts/dense_focal_headroom.py verify
          python scripts/diagnose_dense_focal_readout.py replay
      - name: Replay the local frozen-point precision comparison
        run: python scripts/score_matched_focal_heads.py verify
      - name: Refit depth scales and verify surface and pixel geometry results
        env:
          OPENBLAS_NUM_THREADS: "1"
        run: |
          python scripts/score_depth_scale_study.py verify
          python scripts/diagnose_depth_scale_pixels.py verify
          python scripts/depth_geometry_headroom.py verify
          python scripts/depth_spatial_support.py verify
      - name: Verify dense RGB depth decisions, reference scores and known-error controls
        env:
          OPENBLAS_NUM_THREADS: "1"
        run: |
          python scripts/score_dense_rgb_depth.py verify
          python scripts/dense_rgb_pixel_check.py verify
          python scripts/photometric_positive_control.py verify
      - name: Verify visibility, depth evidence, source-quality interventions and spatial transfer
        env:
          OPENBLAS_NUM_THREADS: "1"
        run: |
          python scripts/visibility_positive_control.py verify
          python scripts/run_visibility_model.py verify
          python scripts/score_visibility_model.py verify
          python scripts/depth_source_transplant.py verify
          python scripts/depth_grid_surface.py verify
          python scripts/spatial_depth_transfer.py verify
          python scripts/capture_visibility_support.py verify
          python scripts/observation_selection.py verify
      - name: Replay camera-spacing coverage and verify matched-input temporal comparisons
        env:
          OPENBLAS_NUM_THREADS: "1"
        run: |
          python scripts/prepare_source_spacing.py verify
          python scripts/source_spacing_control.py verify
          python scripts/collect_spacing_heads.py verify
          python scripts/predict_temporal_depth.py verify
          python scripts/score_temporal_depth.py verify
          python scripts/nearby_camera_depth_control.py verify
          python scripts/nearby_motion_depth.py verify
          python scripts/motion_depth_shrinkage.py verify
          python scripts/motion_source_substitution.py verify
          python scripts/nearby_rig_components.py verify
          python scripts/external_orientation_control.py verify
          python scripts/joint_camera_control.py verify
          python scripts/baseline_length_control.py verify
          python scripts/motion_reliability_weights.py verify
          python scripts/motion_reliability_surface.py verify
          python scripts/motion_spatial_placement.py verify
          python scripts/motion_placement_surface.py verify
          python scripts/motion_paired_geometry.py verify
          python scripts/motion_icp_effect.py verify
          python scripts/motion_shuffle_repeats.py verify
          python scripts/fit_rgb_surface_weights.py verify
          python scripts/score_surface_fitted_weights.py verify
          python scripts/depth_correction_diffusion.py verify
          python scripts/depth_diffusion_axial.py verify
          python scripts/per_view_alignment.py verify
          python scripts/rgb_rigid_view.py verify
          python scripts/rgb_rigid_paired.py verify
          python scripts/rigid_reference_surface.py verify
          python scripts/cross_view_surface.py verify
          python scripts/cross_view_axial.py verify
          python scripts/tco_cross_view_acceptance.py verify
          python scripts/anchor_ensemble_surface.py verify
          python scripts/anchor_ensemble_axial.py verify
          python scripts/anchor_pose_surface.py verify
          python scripts/anchor_disagreement_benefit.py verify
          python scripts/anchor_prior_fusion.py verify
          python scripts/anchor_prior_pose_errors.py verify
          python scripts/anchor_prior_gain_controls.py verify
          python scripts/camera_tangent_depth.py verify
          python scripts/camera_prior_selection_bound.py verify
          python scripts/tangent_paired_geometry.py verify
          python scripts/camera_mesh_render.py verify
          python scripts/camera_mesh_paired.py verify
          python scripts/camera_mesh_depth_bands.py verify
          python scripts/camera_mesh_range_limit.py verify
          python scripts/prior_noise_paired.py verify
          python scripts/prior_direction_paired.py verify
          python scripts/camera_prior_noise_repeats.py verify
          python scripts/prior_direction_control.py verify
          python scripts/prior_noise_normal_regions.py verify
          python scripts/neighborhood_tangent.py verify
          python scripts/joint_reprojection_paired.py verify
          python scripts/joint_rgb_reprojection.py verify
          python scripts/profile_camera_depth.py verify
      - run: python scripts/replay_neighbor_sparse_depth.py verify
      - run: python scripts/replay_supplied_pose_sparse_depth.py
      - run: python scripts/replay_shifted_sparse_grid.py
      - run: python scripts/replay_mast3r_transfer.py
      - run: python scripts/replay_mast3r_joint_priors.py
      - run: python scripts/verify_mast3r_adapter_probe.py
      - run: python scripts/verify_mast3r_neural_plan.py
      - run: python scripts/plan_mast3r_crossover.py
      - run: python scripts/replay_mast3r_neural_transfer.py
      - run: python scripts/replay_mast3r_neural_repeat.py
      - run: python scripts/replay_mast3r_crossover.py
      - name: Replay held-source MASt3R shape fits and headroom
        run: |
          python scripts/score_partner_shape.py verify
          python scripts/partner_bias_control.py verify
          python scripts/audit_partner_headroom.py --verify
          python scripts/partner_bias_surface.py verify
          python scripts/replay_partner_surface_points.py
      - name: Check profiled LoRA mathematical design
        run: python scripts/check_lora_profiled_gradient.py --verify
      - name: Verify profiled LoRA inputs and production geometry
        run: |
          python scripts/prepare_profiled_inputs.py --verify
          python scripts/check_profiled_splits.py --verify
          python scripts/check_profiled_calibration.py --verify
          python scripts/check_profiled_final_calibration.py --verify
      - name: Exercise profiled prediction sealing and metric selection fixtures
        run: python scripts/test_profiled_scoring.py
      - name: Independently replay the completed profiled LoRA development screen
        run: python scripts/replay_profiled_public_scores.py --output reports/ci/profiled_public_replay.json
      - name: Independently check the MASt3R calibration response from sealed matrices
        run: python scripts/verify_profiled_calibration_secant.py --attempt d1_01 --verify-only
      - name: Replay the published compensation verdict from view aggregates
        if: ${{ hashFiles('results/lora_profiled_compensation_v1/held_source_scores.json') != '' }}
        run: python scripts/replay_compensation_published_metrics.py
      - name: Replay the native LoRA directional test from view aggregates
        if: ${{ hashFiles('results/native_lora_direction_v1/held_source_scores.json') != '' }}
        run: python scripts/replay_native_lora_direction.py
      - name: Replay fresh-room LoRA step selection from view aggregates
        if: ${{ hashFiles('results/native_lora_step_v1/held_scores.json') != '' }}
        run: python scripts/replay_native_lora_step.py
      - name: Replay matched MASt3R decoder group selection and development gate
        if: ${{ hashFiles('results/native_lora_decoder_groups_v1/held_scores.json') != '' }}
        run: python scripts/replay_native_lora_decoder_groups.py
      - name: Replay the TCO frozen-layer benchmark with missing-control bounds
        if: ${{ hashFiles('results/tco_frozen_prefix_v1/partial_evidence.json') != '' }}
        run: python scripts/bound_tco_frozen_prefix.py --evidence results/tco_frozen_prefix_v1/partial_evidence.json
      - name: Replay the TCO allocator sensitivity comparison
        if: ${{ hashFiles('results/tco_frozen_prefix_v1/allocator_sensitivity_decision.json') != '' }}
        run: python scripts/replay_tco_frozen_prefix.py --allocator-sensitivity
      - name: Check the TCO boundary adapter on synthetic camera geometry
        run: python scripts/check_tco_one_percent.py
      - name: Replay the TCO one-percent study
        if: ${{ hashFiles('results/tco_one_percent_v1/decision.json') != '' }}
        run: python scripts/replay_tco_one_percent.py
      - name: Replay the full-40 TCO recomputation study
        if: ${{ hashFiles('results/tco_full40_recompute_v1/decision.json') != '' }}
        run: python scripts/replay_tco_full40_recompute.py
      - name: Verify the recomputed depth head on CPU
        run: python scripts/tco_full40_recompute.py
      - name: Replay the native-batch TCO camera study
        if: ${{ hashFiles('results/tco_courtyard_camera_v1/decision.json') != '' }}
        run: |
          git -C third_party/TCO apply ../../patches/0001-bfloat16-numpy-export.patch
          python -B -S scripts/replay_tco_courtyard_camera.py
      - name: Verify camera checkpoint gradients on CPU
        run: python scripts/tco_courtyard_camera.py
      - name: Replay the native-batch TCO render-lifetime study
        if: ${{ hashFiles('results/tco_render_lifetime_v1/decision.json') != '' }}
        run: python -B -S scripts/replay_tco_render_lifetime.py
      - name: Replay the five-view TCO retention study
        if: ${{ hashFiles('results/tco_five_view_replay_cache_v1/decision.json') != '' }}
        run: |
          python -B -S scripts/replay_five_view_release.py replay
          python -B -S scripts/replay_five_view_release.py allocator-receipt
          python -B -S scripts/test_tco_five_view_replay_cache.py
          python -B scripts/test_tco_five_view_gradients.py
      - name: Replay the local TCO stall, quality and capacity study
        if: ${{ hashFiles('results/tco_native_stalls_quality_capacity_v1/decision.json') != '' }}
        run: |
          python -B -S scripts/replay_tco_native_stalls_quality_capacity_release.py
          python -B -S scripts/test_tco_native_stalls_quality_capacity.py
      - name: Exercise immutable profiled evidence backup fixtures
        run: python scripts/test_archive_profiled_evidence.py
      - name: Replay the five-view LoRA and LayerNorm comparison
        if: ${{ hashFiles('results/tco_final_global_layernorm_v1/final_verdict.json') != '' }}
        run: |
          python -B -S scripts/finalize_tco_final_ln.py verify
          python -B scripts/audit_tco_final_ln_release.py --stage primary
          if [ -f results/tco_final_global_layernorm_v1/replication_decision.json ]; then
            python -B scripts/audit_tco_final_ln_release.py --stage replication
          fi
      - name: Verify prospective M3 fitting inputs without loading predictions
        run: |
          python scripts/check_profiled_m3_inputs.py
          python scripts/check_profiled_m3_network.py
      - run: python scripts/score_mast3r_neural_repeat.py verify
      - run: python scripts/replay_heldout_sparse_depth.py
      - run: python scripts/verify_tum_sparse_inputs.py
      - run: python scripts/replay_tum_sparse_depth.py
      - run: python scripts/verify_tum_verification.py
      - run: python scripts/replay_local_affine_sparse_depth.py
      - run: python scripts/replay_scale_shift_sparse_depth.py
      - name: Refit all 12 joint RGB reprojection models from public inputs
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: python scripts/replay_joint_reprojection_fit.py
