name: CPU evidence validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.1.2
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: python scripts/run_baseline_screen.py --dry-run
